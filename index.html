<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>App</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }
    #gas-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <iframe id="gas-frame" src="about:blank"></iframe>

  <script>
    // 替換為你的 Cloudflare Worker 網址
    const PROXY_BASE_URL = "https://wandering-darkness-d8f6.wanchiachen98.workers.dev";

    // 取得當前網址的所有 query 參數 (例如 ?code=ABC123)
    const queryParams = window.location.search;
    const targetUrl = PROXY_BASE_URL + queryParams;

    // 載入經過代理移除防護標頭的頁面
    document.getElementById('gas-frame').src = targetUrl;
  </script>
</body>
</html>
