<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>載入中...</title>
  <script>
    const GAS_BASE_URL = "https://script.google.com/macros/s/AKfycbwD97bdIZWBUnWFj7hJ7WsEQ-3blhfF-r9yVOQ8deZVqLHeQBUegbiRQwgmR6mHy-Be/exec";

    window.onload = function() {
      // 取得 LIFF 傳入的查詢參數 (例如 ?code=ABC123)
      const queryParams = window.location.search;
      const targetUrl = GAS_BASE_URL + queryParams;

      // 使用 replace 在當前 Tall 視窗內直接轉址，不開啟新視窗
      window.location.replace(targetUrl);
    };
  </script>
</head>
<body style="display: flex; justify-content: center; align-items: center; height: 80vh; font-family: sans-serif; color: #666;">
  <p>正在載入頁面...</p>
</body>
</html>
